name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: npm run typecheck
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: npm run format:check
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: npm test
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Demo must find the planted breaks
        run: |
          set +e
          node scripts/demo.js --json > out.json
          test $? -eq 1
          node -e "const r=JSON.parse(require('fs').readFileSync('out.json','utf8'));const n=r.pairs.flatMap(p=>p.findings).length;if(n<4){console.error('expected >=4 findings, got',n);process.exit(1)}"
